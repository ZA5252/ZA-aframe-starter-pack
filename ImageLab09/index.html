<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: yavapai; dressingAmount: 500"></a-entity>
      <a-sky color="#E30E5F"></a-sky>
      <a-sphere position="0 1 -4" radius = "1.25" color="#F2C4C9"></a-sphere>
      <a-sphere position="0 2.5 -4" radius = "1" color="#F2C4C9"></a-sphere>
      <a-sphere position="0 3.75 -4" radius = "0.75" color="#F2C4C9"></a-sphere>
      <a-sphere position="0 2.1 -3.1" radius = "0.1" color="black"></a-sphere>
      <a-sphere position="0 2.5 -3.005" radius = "0.1" color="black"></a-sphere>
      <a-sphere position="0 2.9 -3.1" radius = "0.1" color="black"></a-sphere>
      <a-sphere position=".2 3.78 -3.27" radius = "0.05" color="black"></a-sphere>
      <a-sphere position="-.2 3.78 -3.27" radius = "0.05" color="black"></a-sphere>
      <a-cone position="0 3.6 -3.05" rotation="90 0 0"radius-bottom="0.1" radius-top="0.01" height="0.5" color="orange"></a-cone>
    </a-scene>
  </body>
</html>
